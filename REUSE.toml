version = 1

[[annotations]]
path = 'Gemfile.lock'
SPDX-FileCopyrightText = "Kerrick Design, LLC <me@kerricklong.com>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = 'public/robots.txt'
SPDX-FileCopyrightText = "Kerrick Design, LLC <me@kerricklong.com>"
SPDX-License-Identifier = "LicenseRef-LICENSE"

[[annotations]]
path = [
  '.dockerignore',
  '.gitattributes',
  '.gitignore',
  '.ruby-version',
  'Dockerfile',
  'Gemfile',
  'Rakefile',
  'config.ru',
  'config/credentials.yml.enc',
  '.kamal/**',
  'bin/**',
]
SPDX-FileCopyrightText = "Kerrick Design, LLC <me@kerricklong.com>"
SPDX-License-Identifier = "LicenseRef-LICENSE"

[[annotations]]
path = [
  'app/assets/**',
  'app/javascript/**',
  'app/views/**',
  'public/**/*.html',
  'public/**/*.png',
  'public/**/*.svg',
  'sig/**/*.rbs',
]
SPDX-FileCopyrightText = "Kerrick Design, LLC <me@kerricklong.com>"
SPDX-License-Identifier = "LicenseRef-LICENSE"

# Generated by Rails (schema dumper rewrites the file, wiping any header),
# test fixtures (data, not source), design docs, and agent skills (Markdown
# whose leading frontmatter a per-file header would break). None are adapted
# from share-alike material, so all carry the repository's default license.
[[annotations]]
path = [
  'db/schema.rb',
  'db/seeds/**/*.yml',
  'test/fixtures/**',
  'doc/**',
  '.agents/**',
]
SPDX-FileCopyrightText = "Kerrick Design, LLC <me@kerricklong.com>"
SPDX-License-Identifier = "LicenseRef-LICENSE"

# Third-party vendored assets: the Simple.css base stylesheet and the OFL
# webfonts. These override the app/assets/** default above (last match wins),
# so their real upstream licenses are recorded rather than the repo default.
[[annotations]]
path = 'app/assets/stylesheets/web/simple.css'
SPDX-FileCopyrightText = "Kev Quirk"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  'app/assets/stylesheets/web/CrimsonPro-VariableFont_wght.woff2',
  'app/assets/stylesheets/web/CrimsonPro-Italic-VariableFont_wght.woff2',
]
SPDX-FileCopyrightText = "2018 The Crimson Pro Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  'app/assets/stylesheets/web/LeagueSpartan-VF.woff2',
  'app/assets/stylesheets/web/LeagueSpartan-VF.woff',
]
SPDX-FileCopyrightText = "2016-2020 Tyler Finck <hi@tylerfinck.com>"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  'app/assets/stylesheets/web/SortsMillGoudy.woff2',
  'app/assets/stylesheets/web/SortsMillGoudy-Italic.woff2',
]
SPDX-FileCopyrightText = "2009 Barry Schwartz, with Reserved Font Name Sorts Mill Goudy"
SPDX-License-Identifier = "OFL-1.1"
